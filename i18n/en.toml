# Site interface, in English.
#
# This is a translation written by someone who knows the subject, not a literal
# rendering of `es.toml`. The keys must match exactly — Hugo falls back to the
# key name when one is missing, so a typo shows up in the page as
# `components.vasak-desktop.title` rather than as a failure.
#
# Out of scope here, on purpose: the Spanish content. Those pages need an
# `.en.md` next to the `.md`, and that is written from the documents, not from
# here.

# `description` is a Hugo reserved key, and Hugo rejects a table that mixes it
# with ordinary keys — so `[site]` could not hold both. That is why the default
# description is called `summary`: it goes in the `description` meta of pages
# that do not bring their own, and it is the `description` of the Organization
# in the JSON-LD, so it changes with the language.
[site]
  summary = "VasakOS is a free operating system based on Arch Linux, with its own Wayland desktop and native applications in Rust. Rolling release, open source."
  tagline = "A desktop of its own, built on Arch Linux, made so the system feels like yours."
  homeTitle = "A desktop of its own, on Arch Linux"

