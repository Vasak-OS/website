[pwa]
  name = "VasakOS"
  shortName = "VasakOS"
  summary = "A free operating system based on Arch Linux, with its own Wayland desktop and native applications written in Rust."

# Group labels from `data/components.yml`. The key is the group's `id`, which
# does not change with the language.
[components_group.escritorio]
  name = "Desktop and session"
[components_group.aplicaciones]
  name = "Applications"
[components_group.servicios]
  name = "System services"
[components_group.entrada]
  name = "Input and accessibility"
[components_group.infraestructura]
  name = "Distribution"

[component.vasak-desktop]
  title = "Desktop"
  text = "Panel, application menu, notification area, network and sound control. Runs on Wayfire with gtk-layer-shell."
[component.vasak-session-manager]
  title = "Session manager"
  text = "The login screen (greetd's greeter) and the screen lock, both in the system's own look."
[component.vasak-desktop-settings]
  title = "Session settings"
  text = "A systemd-managed session (uwsm), compositor plugins, and startup of the desktop services."
[component.vasakos-icon-theme]
  title = "Icon theme"
  text = "A flat, colourful icon set of its own, consistent across every application in the system."
[component.vasak-file-manager]
  title = "File manager"
  text = "Tabs, progress and cancellation on copy/move/delete, undo with Ctrl+Z, compression in several formats, and SMB and sshfs mounts."
[component.vasak-terminal]
  title = "Terminal"
  text = "A terminal emulator with tabs, and a colour palette that follows the system theme."
[component.vasak-settings]
  title = "System settings"
  text = "Users, date and time, brightness and night light, power, network, sound, appearance, and compositor plugins."
[component.vasak-gallery]
  title = "Gallery"
  text = "An image viewer and organiser."
[component.vasak-resonance]
  title = "Resonance"
  text = "The system audio player."
[component.vasak-keyring]
  title = "Keyring"
  text = "A native Secret Service implementation using AES-256-GCM and Argon2id, with automatic unlock through PAM at login."
[component.vasak-flare-daemon]
  title = "Notifications"
  text = "A freedesktop notification daemon with a persistent history."
[component.polkit-vasak-agent]
  title = "PolicyKit agent"
  text = "Authentication dialogs for the actions that need privileges, without going through sudo."
[component.vasak-permissions]
  title = "Application permissions"
  text = "Asks before an application uses the camera, the microphone, the screen, or one of your accounts, and remembers the answer. Today only the accounts are genuinely locked; the camera, microphone and screen are still handed over by the portal, which does not consult this policy yet."
[component.vasak-accounts]
  title = "Online accounts"
  text = "A centralised accounts daemon with OAuth2 and per-application permissions. Settings already uses it: the token is handed over once and no application keeps a copy."
[component.vasak-press-and-hold]
  title = "Press and hold"
  text = "Write accents and special characters by holding a key down, as on macOS, without depending on the keyboard layout."
[component.archiso]
  title = "ISO image"
  text = "An archiso profile with a live session, the Vasak Installer, and the project's own repository already configured."
[component."repositorio vasakos"]
  title = "pacman repository"
  text = "The project's own GPG-signed repository, with the VasakOS packages for Arch Linux."
[component.vasakos-calamares]
  title = "Installer"
  text = "Vasak Installer with the VasakOS configuration and install branches."

[component.vasak-wayfire-plugins]
  title = "Wayfire Plugins"
  text = "Wayfire compositor plugins: panel, gestures, overlays and workspace management."

[component.vasak-text]
  title = "Text Editor"
  text = "Plain text editor with syntax highlighting and multi-tab support."

[component.vasak-calendar]
  title = "Calendar"
  text = "System calendar with online accounts integration and reminders."

[component.vasak-mail]
  title = "Mail"
  text = "Email client with IMAP/SMTP support and PGP encryption."

[component.vasak-contacts]
  title = "Contacts"
  text = "Address book integrated with online accounts and synchronization."

[component.vasak-shot]
  title = "Screenshot"
  text = "Screenshot and screen recording tool with annotations."

[component.vasak-monitor]
  title = "System Monitor"
  text = "Resource viewer: CPU, memory, disk, network and sensors."

[component.vasak-store]
  title = "Store"
  text = "Flatpak and native app store with sandboxing and automatic updates."

[component.vasak-prism]
  title = "Prism"
  text = "Document and PDF viewer with annotations and search."

[component.vasak-installer]
  title = "Vasak Installer"
  text = "Native graphical installer for VasakOS, replacement for Calamares written in Rust/Tauri."

[component.vasak-update]
  title = "Updates"
  text = "System update notifier with changelog details and deferral option."

[component.vasak-wireplumber-modules]
  title = "WirePlumber Modules"
  text = "Audio policy modules for automatic routing and device profiles."

[component.polkit-vasak]
  title = "PolicyKit Agent"
  text = "Native PolicyKit authentication agent, replaces polkit-gnome."

