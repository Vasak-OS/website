[advantages]
  title = "Why VasakOS"
  subtitle = "It is not Arch with a different wallpaper: the desktop, the applications and the services were written for this system."

  [advantages.arch]
    name = "Built on Arch Linux"
    text = "A rolling release, with no versions falling behind and the newest software available. All of Arch's ecosystem and documentation still applies."
  [advantages.rust]
    name = "Native applications in Rust"
    text = "The file manager, terminal, gallery, settings and the desktop itself are applications of our own, not a collection of programs borrowed from other environments."
  [advantages.wayland]
    name = "Wayland from the start"
    text = "A Wayfire session managed by systemd, with screen lock, night light and brightness control built in."
  [advantages.css]
    name = "Restyleable with CSS"
    text = "The interface is styled with CSS and colour variables. Changing how the desktop looks does not mean recompiling anything."
  [advantages.opensource]
    name = "Actually open source"
    text = "Every component lives in its own public repository under the GPL. The history, the issues and the decisions are all in the open."
  [advantages.privacy]
    name = "No telemetry"
    text = "The system collects no usage data and sends nothing to any server. There is no account to create and no service to subscribe to."

