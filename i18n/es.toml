[advantages]
  title = "Por qué VasakOS"
  subtitle = "No es Arch con otro fondo de pantalla: el escritorio, las aplicaciones y los servicios están escritos para este sistema."

  [advantages.arch]
    name = "Base Arch Linux"
    text = "Rolling release, sin versiones que se queden atrás y con acceso al software más nuevo. Todo el ecosistema y la documentación de Arch siguen valiendo."
  [advantages.rust]
    name = "Aplicaciones nativas en Rust"
    text = "Gestor de archivos, terminal, galería, ajustes y el escritorio son aplicaciones propias, no una colección de programas de otros entornos."
