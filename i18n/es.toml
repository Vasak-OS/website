# Interfaz del sitio, en español.
#
# Todo lo que una persona lee en pantalla y no viene de `content/` está aquí.
# `content/` es el idioma por defecto y no necesita traducción; lo que sí necesita
# es su equivalente `.en.md`, y eso no se escribe desde acá.
#
# Las claves son estáticas y con notación de puntos. Cuando el texto se compone
# —una fecha, un número, un contador— la clave trae el esqueleto y el resto se
# pasa con `i18n` en el orden de los verbos: el que va primero es el que decide
# el idioma.
#
# Lo que queda fuera de este archivo a propósito: los nombres propios, los
# comandos, las rutas, las URLs y el texto dentro de bloques de código, que son
# cosas que no se traducen.

# `description` es una clave reservada de Hugo, y Hugo rechaza que una tabla la
# mezcle con claves comunes — `[site]` no podría tener las dos. Por eso la
# descripción por defecto se llama `summary`: es la que va en la etiqueta
# `description` de las páginas que no traen la suya, y también la `description`
# de la Organization del JSON-LD, así que cambia con el idioma.
[site]
  summary = "VasakOS: sistema operativo libre basado en Arch Linux, con escritorio propio en Wayland y aplicaciones nativas en Rust. Rolling release y de código abierto."
  tagline = "Un escritorio propio sobre Arch Linux, hecho para que el sistema se sienta tuyo."
  homeTitle = "Un escritorio propio sobre Arch Linux"

