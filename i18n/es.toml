    name = "Wayland de entrada"
    text = "Sesión sobre Wayfire administrada por systemd, con bloqueo de pantalla, luz nocturna y control de brillo integrados."
  [advantages.css]
    name = "Personalizable con CSS"
    text = "La interfaz se estiliza con CSS y variables de color. Cambiar el aspecto del escritorio no requiere recompilar nada."
