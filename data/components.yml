# The components of VasakOS, their published version and how far along they are.
#
# This drives the home page section and the /state/ page. Being specific — and
# honest about what is still rough — is what separates a project someone can
# evaluate from a landing page full of adjectives.
#
# status: stable | beta | alpha | wip | planned
# Versions match the packages published in the `vasakos` pacman repository.
#
# What is NOT here: the title and the description of each component, and the name
# of each group. Those are prose, they change with the language, and they live in
# i18n/<lang>.toml under `component.<name>` and `components_group.<id>`. What
# stays here is what does not change: which packages exist, which version each
# one is on, how finished it is, and where the code lives. Duplicating all of
# that per language to carry five sentences of prose is how the two copies drift.
#
# The `id` of a group and the `name` of a package are the join keys against
# i18n. They are stable identifiers, not display text, so they are not
# translated.

groups:
  - id: escritorio
    icon: fa-solid fa-desktop
    items:
      - name: vasak-desktop
        version: "1.1.3"
        status: beta
        repo: https://github.com/Vasak-OS/vasak-desktop
      - name: vasak-session-manager
        version: "0.2.0"
        status: alpha
        repo: https://github.com/Vasak-OS/vasak-session-manager
      - name: vasak-desktop-settings
        version: "0.4.0"
        status: beta
        repo: https://github.com/Vasak-OS/vasak-desktop-settings
      - name: vasakos-icon-theme
        version: "0.6.0"
        status: stable
        repo: https://github.com/Vasak-OS/VasakOS-icon-theme

  - id: aplicaciones
    icon: fa-solid fa-folder
    items:
      - name: vasak-file-manager
        version: "0.4.1"
        status: beta
        repo: https://github.com/Vasak-OS/vasak-file-manager
      - name: vasak-terminal
        version: "0.3.1"
        status: beta
        repo: https://github.com/Vasak-OS/vasak-terminal
      - name: vasak-settings
        version: "0.2.1"
        status: alpha
        repo: https://github.com/Vasak-OS/vasak-settings
      - name: vasak-gallery
        version: "0.2.0"
        status: alpha
        repo: https://github.com/Vasak-OS/vasak-gallery
      - name: vasak-resonance
        version: "0.2.0"
        status: alpha
        repo: https://github.com/Vasak-OS/vasak-resonance

  - id: servicios
    icon: fa-solid fa-shield-halved
    items:
      - name: vasak-keyring
        version: "0.2.0"
        status: alpha
        repo: https://github.com/Vasak-OS/vasak-keyring
      - name: vasak-flare-daemon
        version: "0.2.0"
        status: alpha
        repo: https://github.com/Vasak-OS/vasak-flare-daemon
      - name: polkit-vasak-agent
        version: "0.1.0"
        status: alpha
        repo: https://github.com/Vasak-OS/polkit-vasak
      - name: vasak-permissions
        version: "0.1.0"
        status: alpha
        repo: https://github.com/Vasak-OS/vasak-permissions
      - name: vasak-accounts
        version: "0.2.0"
        status: alpha
        repo: https://github.com/Vasak-OS/vasak-accounts

  - id: entrada
    icon: fa-solid fa-pen
    items:
      - name: vasak-press-and-hold
        version: "0.1.0"
        status: alpha
        repo: https://github.com/Vasak-OS/vasak-press-and-hold

  - id: infraestructura
    icon: fa-solid fa-download
    items:
      - name: archiso
        version: "Alpha 4"
        status: alpha
        repo: https://github.com/Vasak-OS/archiso
      - name: repositorio vasakos
        # No es un número de versión: lo que se publica es que el repositorio
        # está en servicio. En inglés la columna Version decía "activo".
        version: "active"
        status: stable
        repo: https://github.com/Vasak-OS/repository-script
      - name: vasakos-calamares
        version: "3.4.2"
        status: beta
        repo: https://github.com/Vasak-OS/vasakos-calamares-config

# Shown on /state/ so nobody has to reverse-engineer what "Alpha" means here.
# `class` is a Tailwind class and has to be in a scanned file, so it stays here;
# `label` is prose and lives in i18n under `status.<key>`.
legend:
  stable: { class: "bg-status-success/15 text-status-success" }
  beta: { class: "bg-primary/15 text-primary" }
  alpha: { class: "bg-status-warning/15 text-status-warning" }
  wip: { class: "bg-secondary/15 text-secondary" }
  planned: { class: "bg-ui-surface text-tx-muted" }
