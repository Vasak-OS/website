# The components of VasakOS, their published version and how far along they are.
#
# This drives the home page section and the /state/ page. Being specific — and
# honest about what is still rough — is what separates a project someone can
# evaluate from a landing page full of adjectives.
#
# status: stable | beta | alpha | wip | planned
# Versions match the packages published in the `vasakos` pacman repository.
#
# What is NOT here: the title and the description of each component, and the name
# of each group. Those are prose, they change with the language, and they live in
# i18n/<lang>.toml under `component.<name>` and `components_group.<id>`. What
# stays here is what does not change: which packages exist, which version each
# one is on, how finished it is, and where the code lives. Duplicating all of
# that per language to carry five sentences of prose is how the two copies drift.
#
# The `id` of a group and the `name` of a package are the join keys against
# i18n. They are stable identifiers, not display text, so they are not
# translated.

groups:
  - id: escritorio
    icon: fa-solid fa-desktop
    items:
      - name: vasak-desktop
        version: "1.1.3"
        status: beta
        repo: https://github.com/Vasak-OS/vasak-desktop
      - name: vasak-session-manager
        version: "0.2.0"
        status: alpha
        repo: https://github.com/Vasak-OS/vasak-session-manager
      - name: vasak-desktop-settings
        version: "0.4.0"
        status: beta
        repo: https://github.com/Vasak-OS/vasak-desktop-settings
      - name: vasakos-icon-theme
        version: "0.6.0"
        status: stable
        repo: https://github.com/Vasak-OS/VasakOS-icon-theme

  - id: aplicaciones
    icon: fa-solid fa-folder
    items:
