# Propiedades del análisis de SonarQube Cloud que el workflow de la
# organización no puede pasar: su paso «Análisis» sólo recibe por `-D` la
# organización, la clave del proyecto, las exclusiones y el lcov; todo lo
# demás lo lee el scanner de este archivo, que está en la raíz del repo.
#
# Sonar analiza cada archivo como si fuera un documento HTML completo, y una
# plantilla parcial de Hugo no lo es. Lo que sigue se descarta donde el
# analizador no tiene vista —y sólo ahí—: ninguna de estas reglas puede juzgar
# el sitio compilado, eso lo comprueba `bun test` contra `public/` en el job
# `sitio` de la CI.
#
# Sin `<title>` en la plantilla, porque lo emite `partials/head.html`, que
# `baseof.html` llama con `{{ partial }}` y el analizador no sigue: la página
# publicada tiene su título, y el comprobador del sitio (el que sí lee el HTML
# final) está en la suite.
sonar.issue.ignore.multicriteria.1.rule=Web:PageWithoutTitleCheck
sonar.issue.ignore.multicriteria.1.resource=themes/vasakos/layouts/_default/baseof.html
sonar.issue.ignore.multicriteria.1.message=El titulo lo emite partials/head.html, que esta plantilla llama; el analizador no sigue los partials.
