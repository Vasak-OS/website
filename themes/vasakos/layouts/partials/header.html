<header class="sticky top-0 bg-ui-bg/80 backdrop-blur-md z-40 drop-shadow-xl m-2 mb-0 rounded-corner">
  <nav class="mx-auto flex items-center justify-between p-6 lg:px-8" aria-label="{{ T "nav.main" }}">
    <div class="flex lg:flex-1">
      <a href="{{ site.Home.RelPermalink }}" class="-m-1.5">
        <span class="sr-only">VasakOS</span>
        <img class="h-10 w-auto" src="{{ .Site.Params.images.logo }}" alt="" title="VasakOS" />
      </a>
    </div>
    <div class="flex lg:hidden">
      <button type="button" class="-m-2.5 inline-flex items-center justify-center rounded-md p-2.5 text-tx-main hover:text-brand-text" onclick="openMobileMenu()" aria-expanded="false" aria-controls="mobile-menu" aria-label="{{ T "nav.openMenu" }}">
        <span class="sr-only">{{ T "nav.openMenu" }}</span>
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      </button>
    </div>
    <div class="hidden lg:flex lg:gap-x-12">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL | relLangURL }}" {{ if eq .Params.newtab true }}target="_blank" {{ end }} title="{{- .Name -}}"
        class="text-lg font-semibold leading-6 text-gray-900 dark:text-white hover:text-brand-text">
        {{- .Name -}}
      </a>
      {{ end }}
    </div>
    <div class="hidden lg:flex lg:flex-1 lg:items-center lg:justify-end lg:gap-3">
      {{- partial "head/lang.html" . -}}
      {{- partial "head/darkmode.html" . -}}
    </div>
  </nav>

</header>
<dialog class="lg:hidden mobile-menu-dialog" aria-label="{{ T "nav.main" }}" style="background: transparent !important;">
  <div id="mobile-menu"
    class="fixed inset-y-0 right-0 z-50 w-full overflow-y-auto bg-ui-bg/80 px-6 py-6 sm:max-w-sm hidden">
    <div class="flex items-center justify-between">
      <a href="{{ site.Home.RelPermalink }}" class="-m-1.5">
        <span class="sr-only">VasakOS</span>
        <img class="h-10 w-auto" src="{{ .Site.Params.images.logo }}" alt="" title="VasakOS" />
      </a>
      <button type="button" class="-m-2.5 rounded-md p-2.5 text-tx-main hover:text-brand-text" onclick="closeMobileMenu()" aria-label="{{ T "nav.closeMenu" }}">
        <span class="sr-only">{{ T "nav.closeMenu" }}</span>
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div class="mt-6 flow-root">
      <div class="-my-6 divide-y divide-gray-500/10">
        <div class="space-y-2 py-6">
          {{ range .Site.Menus.main }}
          <a href="{{ .URL | relLangURL }}" {{ if eq .Params.newtab true }}target="_blank" {{ end }}
            title="{{- .Name -}}"
            onclick="closeMobileMenu()"
            class="-mx-3 block rounded-lg px-3 py-2 text-base font-semibold leading-7 text-tx-main hover:text-brand-text">
            {{- .Name -}}
          </a>
          {{ end }}
        </div>
        <div class="flex items-center gap-3 py-6">
          {{- partial "head/lang.html" . -}}
          {{- partial "head/darkmode.html" . -}}
        </div>
      </div>
    </div>
  </div>
</dialog>
