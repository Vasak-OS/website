<section class="px-4 py-16">
  <div class="mx-auto mb-10 max-w-3xl text-center">
    <h2 class="text-3xl font-bold text-gray-900 sm:text-4xl dark:text-white">{{ site.Params.advantages.title }}</h2>
    <p class="mt-4 text-gray-600 dark:text-gray-300">{{ site.Params.advantages.subtitle }}</p>
  </div>
  <div class="mx-auto flex max-w-screen-xl flex-wrap">
    {{ range site.Params.advantages.main }}
    <div class="w-full px-4 pb-8 md:w-1/2 lg:w-1/3">
      <div
        class="h-full rounded-corner bg-ui-bg/80 p-5 shadow-lg duration-700 hover:-translate-y-5 hover:shadow-2xl md:px-7 xl:px-10">
        <div
          class="mb-8 flex h-[70px] w-[70px] items-center justify-center rounded-2xl bg-gradient-to-br from-secondary to-primary">
          <i class="{{ .params.icon }} text-3xl text-white" aria-hidden="true"></i>
        </div>
        <h3 class="mb-3 text-xl font-semibold text-gray-800 dark:text-gray-100">{{ .name }}</h3>
        <p class="text-gray-600 dark:text-gray-400">{{ .text }}</p>
      </div>
    </div>
    {{ end }}
  </div>
</section>
