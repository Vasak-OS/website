<section class="bg-ui-bg/80">
  <div class="mx-auto max-w-screen-xl px-4 py-8 sm:px-6 sm:py-12 lg:px-8 lg:py-16">
    <div class="grid grid-cols-1 gap-8 lg:grid-cols-2 lg:gap-16">
      <div class="relative h-64 overflow-hidden rounded-lg sm:h-80 lg:order-last lg:h-full">
        <img src="/img/community.svg" width="800" height="600" loading="lazy" decoding="async"
          alt="{{ T "cta.imageAlt" }}" class="absolute inset-0 h-full w-full object-cover" />
      </div>

      <div class="lg:py-24 flex flex-col justify-center">
        <h2 class="text-3xl font-bold sm:text-4xl text-gray-900 dark:text-white text-center">{{ T "cta.title" }}</h2>

        <p class="mt-4 text-gray-600 dark:text-gray-300">
          {{ T "cta.body" }}
        </p>

        <a href="{{ "/downloads/" | relLangURL }}"
          class="mt-8 inline-block rounded-corner bg-primary text-center text-3xl px-12 py-4 font-medium text-white transition hover:shadow-2xl hover:text-white focus:outline-none">
          {{ T "cta.button" }}
        </a>
      </div>
    </div>
  </div>
</section>
