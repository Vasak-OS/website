<script>
(function () {
  function set(elId, value) {
    const el = document.getElementById(elId);
    if (el) el.textContent = value;
  }

  function fmt(n) {
    return n.toLocaleString();
  }

  async function fetchWithRetry(url, parser, retries = 3, delay = 1000) {
    for (let i = 0; i < retries; i++) {
      try {
        const res = await fetch(url, { mode: 'cors' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        return parser(text);
      } catch (err) {
        console.warn('Counter attempt ' + (i + 1) + ' failed:', url, err);
        if (i < retries - 1) await new Promise(r => setTimeout(r, delay));
      }
    }
    return null;
  }

  /* ── GitHub stars ──
     Usa el repo principal del escritorio (el más representativo del proyecto). */
  (async () => {
    try {
      const res = await fetch('https://api.github.com/repos/Vasak-OS/vasak-desktop', { mode: 'cors' });
      if (res.status === 403) throw new Error('rate limited');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      set('counter-github-stars', fmt(data.stargazers_count || 0));
    } catch (err) {
      console.warn('GitHub stars failed:', err);
      set('counter-github-stars', '0');
    }
  })();

  /* ── SourceForge downloads ──
     SourceForge no tiene API JSON pública para totales. Intenta varias rutas
     y patrones de regex. Si todo falla, deja 0. */
  (async () => {
    const urls = [
      'https://sourceforge.net/projects/vasakos/',
      'https://sourceforge.net/projects/vasakos/files/',
      'https://sourceforge.net/projects/vasakos/stats/',
    ];
    const patterns = [
      /Downloads[^\d]*([\d,]+)/i,
      /([\d,]+)\s*downloads/i,
      /total downloads[^\d]*([\d,]+)/i,
    ];
    let result = null;
    for (const url of urls) {
      result = await fetchWithRetry(url, (text) => {
        for (const p of patterns) {
          const m = text.match(p);
          if (m) return m[1];
        }
        return null;
      }, 2, 800);
      if (result) break;
    }
    set('counter-sourceforge-downloads', result || '0');
  })();

  /* ── Telegram members ──
     No hay API pública de Telegram para contar miembros de un canal/grupo
     sin un bot token y sin que el bot sea administrador del canal.
     Deja 0 hasta que se configure un bot. */
  set('counter-telegram-members', '0');
})();
</script>
