<div class="text-center">
  {{ $ext := path.Ext .Destination }}
  {{ $webpPath := replace .Destination $ext ".webp" }}
  <picture>
    {{ if ne $ext ".webp" }}
    <source srcset="{{ $webpPath }}" type="image/webp" />
    {{ end }}
    <img src="{{ .Destination | safeURL }}" alt="{{ .Text }}" loading="lazy" decoding="async" class="rounded-corner my-2" />
  </picture>
</div>
