<div class="mt-6">
  <div class="max-w-4xl px-10 py-6 mx-auto bg-cover bg-center rounded-l shadow-m"
    style="background-image: url('{{ .Params.img }}');">
    <div class="bg-ui-bg/80 rounded-s backdrop-blur-md p-3">
      <div class="flex items-center justify-between">
        <span class="font-light text-tx-muted">
          {{ partial "date.html" .Date}}
        </span>
      </div>
      <div class="mt-2 text-tx-muted">
        <a href="{{ .RelPermalink }}" class="text-2xl font-bold text-secondary hover:underline">{{ .Title }}</a>
        <p class="mt-2">{{ .Summary }}</p>
      </div>
      <div class="flex items-center justify-end m-4">
        <a href="{{ .RelPermalink }}" class="text-brand-text hover:underline">{{ T "card.read" }} <em class="fas fa-eye" aria-hidden="true"></em></a>
      </div>
    </div>
  </div>
</div>
