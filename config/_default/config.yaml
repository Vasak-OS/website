baseURL: "https://os.vasak.net.ar/"
title: "VasakOS"
summaryLength: 20

# Multilingual.
#
# The Spanish site stays at the root and English goes under /en/. That is
# `defaultContentLanguageInSubdir: false`, the Hugo default, and it is a
# deliberate choice: every URL the site has published since it went live keeps
# working. Turning it on would move the whole Spanish site under /es/ and break
# every inbound link, the old bookmarks, and the tests that assert published
# paths. /en/ is unambiguous enough without paying that.
#
# `title` is not repeated per language on purpose: the brand is the brand. The
# per-language strings that differ live in i18n/<lang>.toml.
languages:
  es:
    locale: "es-AR"
    label: "Español"
    direction: "ltr"
    contentDir: "content"
    weight: 1
    title: "VasakOS"
  en:
    locale: "en-GB"
    label: "English"
    direction: "ltr"
    contentDir: "content"
    weight: 2
    title: "VasakOS"

defaultContentLanguage: "es"
defaultContentLanguageInSubdir: false

# canonifyurls rewrote every relative link into an absolute one, which bloats
# the HTML and breaks any preview served from a different host. The templates
# emit root-relative URLs, which work everywhere.
canonifyurls: false

pagerSize: 6

theme: "vasakos"

enableRobotsTXT: true

outputs:
  page: ["HTML"]
  section: ["HTML"]
  home: ["HTML", "RSS", "JSON", "WEBAPPMANIFEST"]

outputFormats:
  # The JSON output feeds the documentation search box. Restricting it to a
  # dedicated /search-index.json keeps it out of the crawl and makes it obvious
  # what it is for. One per language, because the titles it holds are the
  # translated ones and a search box that answered in the wrong language would
  # be worse than no search box.
  JSON:
    mediaType: "application/json"
    baseName: "search-index"
    isPlainText: true
  # The web app manifest is a template rather than a file in static/ so that its
  # name, description, lang and start_url follow the language of the page that
  # links it. A single Spanish manifest linked from /en/ installed an app called
  # "Vasak OS" that opened the Spanish site.
  WEBAPPMANIFEST:
    mediaType: "application/manifest+json"
    baseName: "manifest"
    isPlainText: true

taxonomies:
  tag: "tags"
  category: "categories"

permalinks:
  blog: "/blog/:year/:month/:title"

# With two languages Hugo writes a single sitemap index that points at one
# sitemap per language, which is the form search engines expect. Disabling the
# pretty URLs keeps the language directories visible in the paths
# (/sitemap.xml, /en/sitemap.xml) so the index is readable.
sitemap:
  changefreq: "weekly"
  priority: 0.6
  filename: "sitemap.xml"

# Full-content RSS produced a 100 KB feed on every build. Readers only need
# enough to decide whether to click.
services:
  rss:
    limit: 20

security:
  exec:
    allow:
      - "^node$"
      - "^/usr/bin/node$"
      - "^/usr/local/bin/node$"
      - "^tailwindcss$"
      - "^.*/node_modules/.bin/tailwindcss$"
      - "^npx$"
      - "^npm$"
      - "^bun$"

minify:
  disableXML: true
  minifyOutput: true
  tdewolff:
    html:
      keepDocumentTags: true
      keepEndTags: true
      keepQuotes: true

# Markdown settings live in markup.yaml.

# resources.GetRemote caches remote assets between builds; without a long TTL a
# clean CI build re-downloads Mermaid every time.
caches:
  getresource:
    maxAge: "720h"
