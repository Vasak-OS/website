images:
  # Marca
  logo: /img/logo.svg
  favicon: /img/icon.svg
  logoOg: https://os.vasak.net.ar/img/logo.svg

  # Hero / Homepage
  hero:
    background: /img/hero-fullscreen-bg.webp
    fallback: /img/hero-fullscreen-bg.jpg
    preload: /img/hero-bg.png
    og: /img/hero-fullscreen-bg.jpg

  # Secciones
  cta: /img/community.svg
  about: /img/about.svg

  # Features (homepage)
  features:
    openSource: /img/features/git.svg
    responsible: /img/features/balanced.svg

  # About page
  aboutPage:
    home: /img/features/home.svg
    study: /img/features/study.svg
    work: /img/features/work.svg

  # Posts (por defecto)
  posts:
    news: /img/posts/news.svg
    donate: /img/posts/donate.svg
    download: /img/posts/download.svg
    terms: /img/posts/terms.svg
    policy: /img/posts/policy.svg

  # Screenshots gallery
  screenshots:
    enabled: true
    main:
      - identifier: desktop
        image: /img/screenshots/desktop.jpg
        alt: Escritorio de Vasak OS
        caption: Escritorio principal con aplicaciones nativas
        weight: 1
      - identifier: apps
        image: /img/screenshots/apps.jpg
        alt: Aplicaciones de Vasak OS
        caption: Centro de aplicaciones y herramientas del sistema
        weight: 2
      - identifier: terminal
        image: /img/screenshots/terminal.jpg
        alt: Terminal de Vasak OS
        caption: Terminal personalizada con colores del sistema
        weight: 3

social:
  enabled: true
  title: Redes Sociales
  main:
    - identifier: telegram
      name: Comunidad Telegram
      url: https://t.me/VasakOS
      weight: 1
      params:
        icon: fab fa-telegram
    - identifier: twitter
      name: Twitter
      url: https://twitter.com/VasakOSLinux
      weight: 6
      params:
        icon: fab fa-twitter
    - identifier: github
      name: GitHub
      url: https://github.com/Vasak-OS
      weight: 10
      params:
        icon: fab fa-github
    - identifier: discord
      name: Discord
      url: https://discord.gg/7wKrVNBC
      weight: 8
      params:
        icon: fab fa-discord
    - identifier: reddit
      name: Reddit
      url: https://www.reddit.com/r/VasakOS/
      weight: 7
      params:
        icon: fab fa-reddit

advantages:
  enabled: true
  main:
    - identifier: linux
      name: Linux
      text: Utilizamos todo el potencial y la seguridad de Linux para ofrecerte una experiencia única.
      weight: 1
      params:
        icon: fab fa-linux
    - identifier: github
      name: Open Source
      text: Todo nuestro código es abierto y puedes verlo en GitHub. ¡Incluso puedes contribuir!
      weight: 1
      params:
        icon: fab fa-github
    - identifier: vuejs
      name: Framework VueJS
      text: Nuestra Interfaz de Usuario está desarrollada con VueJS, un framework moderno y potente.
      weight: 1
      params:
        icon: fab fa-vuejs
    - identifier: tailwind
      name: Responsive
      text: Nuestro sistema se adapta a cualquier dispositivo, ya sea un móvil, una tablet o un ordenador.
      weight: 1
      params:
        icon: fa fa-desktop
    - identifier: css
      name: Personalizable
      text: Al usar CSS para el estilo, el sistema es altamente personalizable y puedes cambiarlo a tu gusto.
      weight: 1
      params:
        icon: fab fa-css3
    - identifier: rust
      name: Rust
      text: Rust es un lenguaje de programación de sistemas que enfatiza la seguridad y el rendimiento.
      weight: 1
      params:
        icon: fab fa-rust

prices:
  enabled: true
  main:
    - identifier: free
      name: Usuarios
      cta:
        label: Descargar
        url: /downloads/
      features:
        - name: Vasak OS para equipos ilimitados.
          class: text-body-emphasis
        - name: Actualizaciones constantes.
          class: text-body-emphasis
        - name: Soporte comunitario.
          class: text-body-emphasis
        - name: Soporte de los desarrolladores.
          class: line-through
        - name: Plan de migración.
          class: line-through
      weight: 1
      params:
        icon: fas fa-user
    - identifier: donations
      class: md:scale-110 z-10
      name: Donaciones
      cta:
        label: Donar
        url: /donate/
      features:
        - name: Vasak OS para equipos ilimitados.
          class: text-body-emphasis
        - name: Actualizaciones constantes.
          class: text-body-emphasis
        - name: Soporte comunitario.
          class: text-body-emphasis
        - name: Soporte de los desarrolladores.
          class: text-body-emphasis
        - name: Plan de migración.
          class: line-through
      weight: 1
      params:
        icon: fas fa-donate
    - identifier: premium
      name: Plan Negocios
      cta:
        label: Contactar
        url: https://vasak.net.ar/
      features:
        - name: Vasak OS para equipos ilimitados.
          class: text-body-emphasis
        - name: Actualizaciones constantes.
          class: text-body-emphasis
        - name: Soporte comunitario.
          class: text-body-emphasis
        - name: Soporte de Vasak Group.
          class: text-body-emphasis
        - name: Plan de migración.
          class: text-body-emphasis
      weight: 1
      params:
        icon: fas fa-user-tie