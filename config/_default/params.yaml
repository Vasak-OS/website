description: "VasakOS es un sistema operativo libre basado en Arch Linux, con escritorio propio sobre Wayland y aplicaciones nativas escritas en Rust. Gratuito, rolling release y de código abierto."

# Rutas de imagen del sitio.
#
# La home y las secciones de la portada las referencian desde acá; la seccion
# de capturas, ademas, usa la lista `screenshots` de mas abajo. Las imagenes
# viven en `themes/vasakos/static/img/`, asi que estas rutas son relativas a la
# raiz del sitio.
#
# `hero.*` ya no lo lee ninguna plantilla de la portada: la home genera sus
# derivados WebP desde `assets/img/hero.jpg` con `resources.Resize` (ver
# `partials/sections/hero.html`), que es la unica forma de que el navegador
# pueda elegir tamaño. Queda solo la imagen para Open Graph.
images:
  # Marca
  logo: /img/logo.svg
  favicon: /img/icon.svg
  logoOg: https://os.vasak.net.ar/img/logo.svg

  # Portada
  hero:
    og: /img/hero-fullscreen-bg.jpg

  # Secciones de la portada
  cta: /img/community.svg
  about: /img/about.svg

  # Bloques de la seccion "features"
  features:
    openSource: /img/features/git.svg
    responsible: /img/features/balanced.svg

  # Pagina "Sobre"
  aboutPage:
    home: /img/features/home.svg
    study: /img/features/study.svg
    work: /img/features/work.svg

  # Imagen por defecto de una publicacion, segun la clase de contenido.
  posts:
    news: /img/posts/news.svg
    donate: /img/posts/donate.svg
    download: /img/posts/download.svg
    terms: /img/posts/terms.svg
    policy: /img/posts/policy.svg

  # Galeria de capturas de la portada.
  #
  # Las imagenes todavia no estan: la plantilla dibuja un marcador en el lugar de
  # cada una mientras falten, que es preferible a una galeria de iconos rotos.
  # Los textos van por clave de traduccion (`screenshots.<identifier>.alt`), no
  # traducidos aca, para que no haya dos lugares que mantener.
  screenshots:
    enabled: true
    main:
      - identifier: desktop
        image: /img/screenshots/desktop.jpg
        weight: 1
      - identifier: apps
        image: /img/screenshots/apps.jpg
        weight: 2
      - identifier: terminal
        image: /img/screenshots/terminal.jpg
        weight: 3

analytics:
  ga4: "G-5MYT335WZK"

social:
  enabled: true
  title: Redes Sociales
  main:
    - identifier: telegram
      name: Comunidad Telegram
      url: https://t.me/VasakOS
      weight: 1
      params:
        icon: fa-brands fa-telegram
    - identifier: github
      name: GitHub
      url: https://github.com/Vasak-OS
      weight: 2
      params:
        icon: fa-brands fa-github
    - identifier: discord
      name: Discord
      url: https://discord.gg/7wKrVNBC
      weight: 3
      params:
        icon: fa-brands fa-discord
    - identifier: reddit
      name: Reddit
      url: https://www.reddit.com/r/VasakOS/
      weight: 4
      params:
        icon: fa-brands fa-reddit
    - identifier: twitter
      name: Twitter
      url: https://twitter.com/VasakOSLinux
      weight: 5
      params:
        icon: fa-brands fa-twitter

# What actually distinguishes the project, in terms a visitor can verify. The
# previous list sold implementation details ("Framework VueJS") and claimed the
# system adapts to phones and tablets, which is not something a desktop OS does.
advantages:
  enabled: true
  title: "Por qué VasakOS"
  subtitle: "No es Arch con otro fondo de pantalla: el escritorio, las aplicaciones y los servicios están escritos para este sistema."
  main:
    - identifier: arch
      name: Base Arch Linux
      text: Rolling release, sin versiones que se queden atrás y con acceso al software más nuevo. Todo el ecosistema y la documentación de Arch siguen valiendo.
      weight: 1
      params:
        icon: fa-brands fa-linux
    - identifier: rust
      name: Aplicaciones nativas en Rust
      text: Gestor de archivos, terminal, galería, ajustes y el escritorio son aplicaciones propias, no una colección de programas de otros entornos.
      weight: 2
      params:
        icon: fa-brands fa-rust
    - identifier: wayland
      name: Wayland de entrada
      text: Sesión sobre Wayfire administrada por systemd, con bloqueo de pantalla, luz nocturna y control de brillo integrados.
      weight: 3
      params:
        icon: fa-solid fa-desktop
    - identifier: css
      name: Personalizable con CSS
      text: La interfaz se estiliza con CSS y variables de color. Cambiar el aspecto del escritorio no requiere recompilar nada.
      weight: 4
      params:
        icon: fa-brands fa-css3
    - identifier: opensource
      name: Código abierto, de verdad
      text: Cada componente vive en su propio repositorio público bajo licencia GPL. El historial, los issues y las decisiones están a la vista.
      weight: 5
      params:
        icon: fa-brands fa-github
    - identifier: privacy
      name: Sin telemetría
      text: El sistema no recolecta datos de uso ni envía información a ningún servidor. No hay cuenta que crear ni servicio al que suscribirse.
      weight: 6
      params:
        icon: fa-solid fa-shield-halved

# Not "prices": the system is free and always will be, and a pricing table on a
# free distro reads as a bait-and-switch. This is how the project sustains
# itself and what each kind of support gets you.
support:
  enabled: true
  title: "Cómo se sostiene el proyecto"
  subtitle: "VasakOS es y va a seguir siendo gratuito. Estas son las formas de acompañarlo."
  main:
    - identifier: free
      name: Usuarios
      description: "Gratis, siempre"
      cta:
        label: Descargar
        url: /downloads/
      features:
        - name: Uso en equipos ilimitados, sin licencias.
          class: text-body-emphasis
        - name: Actualizaciones continuas por el repositorio oficial.
          class: text-body-emphasis
        - name: Soporte de la comunidad en Telegram y GitHub.
          class: text-body-emphasis
        - name: Atención directa del equipo de desarrollo.
          class: line-through
        - name: Plan de migración asistido.
          class: line-through
      weight: 1
      params:
        icon: fa-solid fa-user
    - identifier: donations
      class: md:scale-110 z-10
      name: Donaciones
      description: "Lo que puedas aportar"
      cta:
        label: Donar
        url: /donate/
      features:
        - name: Uso en equipos ilimitados, sin licencias.
          class: text-body-emphasis
        - name: Actualizaciones continuas por el repositorio oficial.
          class: text-body-emphasis
        - name: Soporte de la comunidad en Telegram y GitHub.
          class: text-body-emphasis
        - name: Atención directa del equipo de desarrollo.
          class: text-body-emphasis
        - name: Plan de migración asistido.
          class: line-through
      weight: 2
      params:
        icon: fa-solid fa-hand-holding-dollar
    - identifier: business
      name: Empresas
      description: "A convenir"
      cta:
        label: Contactar
        url: https://vasak.net.ar/
      features:
        - name: Uso en equipos ilimitados, sin licencias.
          class: text-body-emphasis
        - name: Actualizaciones continuas por el repositorio oficial.
          class: text-body-emphasis
        - name: Soporte de la comunidad en Telegram y GitHub.
          class: text-body-emphasis
        - name: Soporte comercial de Vasak Group.
          class: text-body-emphasis
        - name: Plan de migración asistido.
          class: text-body-emphasis
      weight: 3
      params:
        icon: fa-solid fa-user-tie

# Índice del repositorio de paquetes, generado por repository-script/build-db.sh
# en cada publicación. La página /state/ lo lee durante el build para mostrar la
# versión que está realmente publicada de cada componente. Si el servidor no
# responde, se usan las versiones de data/components.yml.
repository:
  name: "vasakos"
  server: "https://repo.vasak.net.ar/repo/x86_64/vasakos"
  index: "https://repo.vasak.net.ar/repo/x86_64/vasakos/vasakos.json"
